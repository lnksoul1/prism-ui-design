name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      # Verifies the published contract over a real stdio handshake: the server
      # starts, completes the MCP initialize exchange, and registers every tool.
      # Unit tests cannot catch a broken transport or a missing registration.
      - name: MCP stdio smoke test
        run: npm run smoke
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
