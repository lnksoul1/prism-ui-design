name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: prism-ui-design-mcp/package-lock.json
      - name: Install dependencies
        working-directory: prism-ui-design-mcp
        run: npm ci
      - name: Lint
        working-directory: prism-ui-design-mcp
        run: npm run lint
      - name: Build
        working-directory: prism-ui-design-mcp
        run: npm run build
      - name: Test
        working-directory: prism-ui-design-mcp
        run: npm test
