<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B0A0F">
<meta name="description" content="Prism Studio v2 — 多平台可视化 UI 设计工具，支持直接编辑、滑块精修、Web/桌面/移动端应用设计">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238B5CF6'/%3E%3Cstop offset='0.5' stop-color='%233B82F6'/%3E%3Cstop offset='1' stop-color='%2306B6D4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%230B0A0F'/%3E%3Cpath d='M16 7 L22 16 L16 25 L10 16 Z' fill='url(%23g)'/%3E%3C/svg%3E">
<title>Prism Studio v2 — 多平台可视化设计工具</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== Top Bar ===== -->
<header class="topbar">
  <div class="topbar-left">
    <span class="logo">Prism</span>
    <span class="project-name" id="project-name">Prism Studio v2 · 多平台设计</span>
  </div>
  <div class="topbar-right">
    <button class="toolbar-btn" id="undo-btn" title="撤销 (Ctrl+Z)">↶ 撤销</button>
    <button class="toolbar-btn" id="redo-btn" title="重做 (Ctrl+Shift+Z)">↷ 重做</button>
    <span class="toolbar-divider"></span>
    <button class="toolbar-btn" id="import-btn" title="导入项目">📥 导入</button>
    <button class="toolbar-btn" id="export-btn" title="导出代码">📤 导出</button>
    <span class="toolbar-divider"></span>
    <button class="toolbar-btn primary" id="share-btn" title="分享预览">🔗 分享</button>
  </div>
</header>

<!-- ===== Main Layout ===== -->
<div class="main-layout">

  <!-- ===== Left Panel: Layers + Library ===== -->
  <aside class="panel panel-left">
    <!-- Layer Panel -->
    <div class="panel-section flex-grow">
      <div class="panel-header">
        <span>图层</span>
        <span class="panel-action" title="添加图层">+</span>
      </div>
      <div class="panel-body">
        <div class="layer-tree" id="layer-list"></div>
      </div>
    </div>

    <!-- Component Library -->
    <div class="panel-section flex-grow">
      <div class="panel-header">
        <span>组件库</span>
        <span class="panel-action" title="搜索">🔍</span>
      </div>
      <div class="panel-body">
        <div class="lib-list" id="library-list"></div>
      </div>
    </div>
  </aside>

  <!-- ===== Center: Canvas ===== -->
  <main class="canvas-area">
    <!-- Canvas Toolbar -->
    <div class="canvas-toolbar">
      <div class="canvas-toolbar-left">
        <span class="canvas-label">画布</span>
        <!-- Platform Switcher -->
        <div class="platform-switcher" id="platform-switcher"></div>
      </div>
      <div class="canvas-toolbar-right">
        <div class="zoom-control">
          <button class="zoom-btn" id="zoom-out" title="缩小 (-)">−</button>
          <span class="zoom-value" id="zoom-value">100%</span>
          <button class="zoom-btn" id="zoom-in" title="放大 (+)">+</button>
        </div>
        <button class="toolbar-btn" id="zoom-reset" title="重置缩放 (0)">⟲</button>
      </div>
    </div>

    <!-- Canvas Scroll Wrap -->
    <div class="canvas-scroll-wrap" id="canvas-scroll-wrap">
      <!-- Canvas frame is rendered here by app.js -->
    </div>

    <!-- Canvas Meta -->
    <div style="padding:4px 12px;background:var(--surface);border-top:1px solid var(--border);font-size:11px;color:var(--text-muted);display:flex;justify-content:space-between;flex-shrink:0;">
      <span id="canvas-meta">0 个组件</span>
      <span>提示: 单击选中 · 双击编辑文字 · 拖拽边角调整大小 · Delete 删除</span>
    </div>
  </main>

  <!-- ===== Right Panel: Property Inspector ===== -->
  <aside class="panel panel-right">
    <div class="panel-header">
      <span>属性检查器</span>
    </div>
    <div class="panel-body" id="inspector-body">
      <!-- Inspector content rendered by app.js -->
    </div>
  </aside>

</div>

<!-- ===== Prompt Bar ===== -->
<div class="prompt-bar">
  <input type="text" class="prompt-input" id="prompt-input" placeholder="输入 AI 指令，如：把主色改成蓝色，增加一个定价卡片">
  <button class="prompt-send" id="prompt-send">发送给 AI</button>
</div>

<!-- ===== Toast ===== -->
<div class="toast" id="toast"></div>

<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
